/**:
  ros__parameters:
    #device_type: 'd435i'
    #serial_no: ''
    #usb_port_id: ''
    #camera_name: 'camera'
    #camera_namespace: 'camera'
    initial_reset: false
    #base_frame_id: camera_link

    accelerate_gpu_with_glsl: false  # Only available if compiled with the flag set to ON. Note: setting to true causes high cpu utilization.
    log_level: info # DEBUG|INFO|WARN|ERROR|FATAL
    wait_for_device_timeout: -1.0 # Timeout for waiting for device to connect (Seconds)
    reconnect_timeout: 6.0  # Timeout(seconds) between consecutive reconnection attempts
    json_file_path: "HighAccuracyPreset.json"  # https://dev.intelrealsense.com/docs/d400-series-visual-presets#preset-table | https://github.com/IntelRealSense/librealsense/wiki/D400-Series-Visual-Presets#preset-table

    enable_sync: true
    enable_color: true
    enable_depth: true
    enable_infra: true
    enable_infra1: true
    enable_infra2: true
    pointcloud.enable: true  # overridden by launch files
    colorizer.enable: false
    align_depth.enable: true # Overridden by launch files
    enable_gyro: true
    enable_accel: true
    enable_rgbd: false
    enable_confidence: false
    enable_pose: false

    # tip: if not using Pointcloud, increase the resolutions
    # tip: reduce to 640x360x30 if CPU utilization is too high (reducing resolution and/or fps leads to lower utilization)
    # note: 848x480x60 is achievable standalone but drops to ~20 Hz under full teleop load (USB + CPU contention with VESC/LiDAR/joystick); 30 Hz is stable integrated
    rgb_camera:
      profile: "848x480x30"   # warning: depracated. Use color_profile instead
      color_profile: "848x480x30"  # 640x360x60, 640x360x30, 640x360x15, 640x480x60, 848x480x30, 1280x720x30
      color_format: "RGB8"  # RGB8, BGR8, etc. Note that to generate colored pointclouds, RGB8 must be used. Other formats will lead to "No stream match for pointcloud chosen texture Process - Color" errors
      enable_auto_exposure: true

    depth_module:
      profile: "848x480x30"  # warning: depracated. Use depth_profile and infra_profile instead
      depth_profile: "848x480x30"  # 640x360x15, 640x480x60, 848x480x30, 1280x720x30
      depth_format: "Z16"
      enable_auto_exposure: true
      infra_profile: "848x480x30"
      infra1_format: "Y8"
      infra2_format: "Y8"
      emitter_enabled: 0  # set to 0 if using infra.  Overridden by launch files
      emitter_on_off: False  # Overridden by launch files

    pointcloud:
      ordered_pc: false  # true; costmaps/clustering don't require ordered clouds, removes per-packet CPU sort
      stream_filter: 2  #  2=colorized pointcloud [recommended], 0=plain white pointcloud, 3=infrared
      stream_index_filter: 0
      allow_no_texture_points: true # true

    gyro_fps: 200 # D435i gyro only supports 200 and 400 Hz;
    accel_fps: 200 # 200; 100 or 200
    unite_imu_method: 2  # 0: no unified imu message, 1: copy, 2: linear interpolation
    angular_velocity_cov: 0.01
    linear_accel_cov: 0.01

    publish_tf: true
#    tf_publish_rate: 200.0
    clip_distance: 6.0  # meters

#    # Enable post-processing filters
#    decimation_filter:
#      enable: true  # halves depth resolution before publishing; downstream uses same depth at half the pixels
#      filter_magnitude: 2
#    spatial_filter:
#      enable: false
#    temporal_filter:
#      enable: false
#    disparity_filter:
#      enable: false
#    hole_filling_filter:
#      enable: false

#    # setup sensor QoS. SYSTEM_DEFAULT [default QoS] | DEFAULT | SENSOR_DATA | PARAMETER_EVENTS | SERVICES_DEFAULT | PARAMETERS
#    color_qos: "SENSOR_DATA"
#    color_info_qos: "SENSOR_DATA"
