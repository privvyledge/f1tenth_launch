/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    # Measured 2026-08-07 on this car (scripts/analysis/fit_actuators.py, see
    # scripts/live_runs/SYSID_RESULTS.md): measured ERPM regressed against
    # ERPM-independent ground speed gives 3757.8 (mapping_drive_170025, R2 0.95)
    # and 4022 / 3830 (figure8_172338 from rf2o / VSLAM, R2 0.99) across six
    # bags spanning 3687-4022. 3750 sits at the low end of that spread, within
    # ~7 % of the best-conditioned estimates, so it is left alone for now --
    # unlike the steering gain below, this inherited value is corroborated
    # rather than corrected. Worth revisiting from the Stage 4b ERPM staircase,
    # which measures it deliberately rather than incidentally.
    speed_to_erpm_gain: 3750.0 # 4614.0, 3850.0
    # Keep at 0.0. ackermann_to_vesc applies this offset unconditionally
    # (erpm = gain * speed + offset), so a nonzero value makes a commanded
    # 0.0 m/s produce nonzero ERPM and the car creeps whenever asked to stop.
    # It is NOT a deadband feedforward, however much it looks like one.
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    # Measured 2026-08-07 (scripts/analysis/fit_actuators.py; full detail and
    # per-bag numbers in scripts/live_runs/SYSID_RESULTS.md). The servo ->
    # road-wheel slope is fitted in servo units against TF-corrected gyro-z
    # through the kinematic bicycle model, so it inherits nothing from the old
    # constants: gain is 1/a where a is rad per servo unit.
    #
    # Averaged over the two bags that both turn both directions AND never hit
    # the servo clamp -- mapping_drive_170025 (a = -0.8783, s0 = 0.5591) and
    # figure8_172338 (a = -0.8688, s0 = 0.5610), 2026-08-05, 147 s and 155 s.
    # They agree to 1.1 %. loop_laps_173558 gives -1.2431 but is one-sided
    # (323 left samples), so it is the spread bound, not an input.
    #
    # The previous -1.4 over-steered by ~18-23 % (achieved/commanded k = 1.22),
    # in the direction the LUCIO side independently found (k = 1.177) from
    # different code, a different yaw reference, and a different regressor.
    #
    # NOTE the offset lands back on 0.56, its inherited value -- measured
    # 0.5591/0.5610. An earlier pass on shorter bags gave 0.5419, biased by
    # those bags spending 17-20 % of their samples pinned at the right-hand
    # servo clamp; these two bags never saturate at all. So the offset was
    # right all along and only the gain was ever wrong.
    # Both still to be confirmed by the Stage 0 bench sweep.
    steering_angle_to_servo_gain: -1.1448 # was -1.4 (unmeasured, from another car)
    steering_angle_to_servo_offset: 0.5600 # measured 0.5591/0.5610 - confirms the inherited value

    port: "/dev/sensors/vesc"
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -15000.0 # -23250.0
    speed_max: 15000.0 # 23250.0
    position_min: 0.0
    position_max: 0.0
    # STILL INHERITED FROM ANOTHER CAR -- not measured on this one. These are
    # the clamp vesc_driver applies (ackermann_to_vesc itself does not clamp).
    # Measured 2026-08-07: servo_max is the RIGHT-hand lock (median yaw while
    # pinned there is -0.86 rad/s, clockwise), and it is the limited direction.
    # servo_min was never reached in either archived bag, so there is no
    # evidence at all here about the left bound. Widening these is what gates
    # the Stage 0 bench sweep from exploring the real mechanical travel -- the
    # gain/offset above do not, since that sweep publishes servo values directly.
    servo_min: 0.08  # 0.15, 0.08
    servo_max: 0.92  # 0.85, 0.92

    # vesc to odom parameters
    odom_frame: odom
    base_frame: base_link
    # publish odom to base link tf
    publish_tf: false
    use_servo_cmd_to_calc_angular_velocity: true
    # Rear-axle to front-axle distance, in metres. 0.256 is the measured value and the one every
    # other consumer already uses: the base_link->front_axle static TF and both front wheel TFs
    # (static_transformations.launch.py), twist_to_ackermann and ackermann_to_twist
    # (vehicle.launch.py), and the min_turning_r derivation in nav2_params.yaml. This was .25
    # ("about 25cm") until 2026-08-07, which biased vesc_odom's kinematic yaw rate
    # (omega = v*tan(delta)/L) about 2.4% high relative to the frames it is fused against.
    wheelbase: 0.256
    # publish AckermannDriveStamped actuator state (speed, steering, accel, jerk) on sensors/actuator_feedback
    publish_actuator_feedback: false
    # use gyro-z from sensors/imu/raw for yaw integration instead of kinematic model
    use_imu_yaw_rate: false
    imu_yaw_invert: false
    # odometry covariance diagonals: [x, y, z, roll, pitch, yaw]
    # z/roll/pitch set to 1e9 (unobservable on a ground vehicle)
    odom_pose_covariance_diagonal: [0.05, 0.05, 1.0e9, 1.0e9, 1.0e9, 0.1]
    # vy set to 0.1 (lateral velocity inferred, not directly measured)
    odom_twist_covariance_diagonal: [0.01, 0.1, 1.0e9, 1.0e9, 1.0e9, 0.05]

    # USB polling rate, i.e IMU and odometry update rate
    poll_rate: 50.0  # default: 50.0
    imu_poll_rate: 100.0  # default: 100.0
    imu_frame: imu_link
    # IMU covariance matrices (9-element row-major 3x3; diagonal only — axes are independent)
    # set a diagonal element to -1 to signal "not measured" to robot_localization
    # units: rad^2 for orientation, (rad/s)^2 for angular velocity, (m/s^2)^2 for linear accel
    imu_orientation_covariance: [0.001, 0.0, 0.0, 0.0, 0.001, 0.0, 0.0, 0.0, 0.005]
    imu_angular_velocity_covariance: [0.001, 0.0, 0.0, 0.0, 0.001, 0.0, 0.0, 0.0, 0.001]
    imu_linear_accel_covariance: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]

    # ackermann_to_vesc: closed-loop PI speed control (disabled by default)
    use_closed_loop_speed: false
    speed_kp: 0.0
    speed_ki: 0.0
    speed_anti_windup: 1000.0
    # ackermann_to_vesc: adaptive feedforward gain (disabled by default)
    use_adaptive_ff: false
    adaptive_ff_alpha: 0.95
    adaptive_ff_gain_min: 1875.0  # speed_to_erpm_gain * 0.5
    adaptive_ff_gain_max: 7500.0  # speed_to_erpm_gain * 2.0

#throttle_interpolator:
#  ros__parameters:
    # throttle interpolator parameters
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    # servo smoother - limits acceleration and smooths anything above limit
    max_acceleration: 1.0 # meters/second^2; reduced for smoother low-speed behavior during motor tuning. Recalibrate speed_to_erpm_gain via VESC Tool (FOC motor detection) before increasing.
    throttle_smoother_rate: 75.0 # messages/sec
    # servo smoother - limits rotation speed and smooths anything above limit
    max_servo_speed: 3.2 # radians/second
    servo_smoother_rate: 75.0 # messages/sec