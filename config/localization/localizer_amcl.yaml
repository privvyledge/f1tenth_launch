# Description: https://navigation.ros.org/configuration/packages/configuring-amcl.html
# Things to tune: alpha*, laser_model_type, robot_model_type, sigma_hit, z_hit
#
# TUNING FOLDED IN FROM localizer_amcl_mapframe.yaml, 2026-08-05, ON MEASUREMENT.
# ------------------------------------------------------------------------------
# The old values here never converged on the raslab map: scored against RTABMap's
# optimized graph on mapping_drive_170025 they gave 267 mm mean / 534 mm p95, with
# AMCL reporting its own sigma as 419 mm / 16.7 deg. The likelihood field was far
# too flat for a 0.05 m grid with only 1732 occupied cells — sigma_hit 0.4 smeared
# each beam over 8 cells, z_rand 0.5 put half the probability mass on "noise", and
# max_beams 90 kept one beam in seven of the X4's ~625.
#
# The values below are the ones measured at 64.7 mm mean / 143.5 mm p95, 87.3 % of
# samples inside the 126 mm bar, converged sigma 75/66 mm and 4.45 deg. That is the
# configuration the 2026-08-05 map-frame deliverable was produced with
# (MAP_FRAME_DELIVERY.md); localizer_amcl_mapframe.yaml is kept unchanged as its
# provenance.
#
# THE PARTICLE COUNT AND update_min_d ARE PART OF THE PACKAGE — do not fold in the
# likelihood parameters alone. Measured: sharpening sigma_hit / z_hit / z_rand /
# max_beams while leaving the old 100-500 particles and 0.2 m update gate makes the
# filter WORSE (345 mm mean, sigma still 150 mm / 10.2 deg) — indistinguishable from
# having no localizer at all. A sharper likelihood field needs enough particles to
# sample it and enough updates to exploit it.
#
# CPU on the Orin Nano, measured from /proc during a 1.0x replay of the control bag
# (same 8.5 Hz scan rate as live): mean 4.1 %, peak 20.4 % OF ONE CORE, 21 MB RSS.
# The pre-fold config cost 1.8 %. The cost of this accuracy is ~2 % of one of six
# cores, which is why the particle count was raised rather than left as a CPU-budget
# compromise. See scripts/live_runs/LOCALIZER_FOLLOWUPS.md.
#
# NOT folded in, because they are replay-specific: use_sim_time, set_initial_pose.
/**: # amcl:
  ros__parameters:
    use_sim_time: False
    set_initial_pose: True # True: use pose below, False: Use RViz 2D Pose Estimate
    # The map frame is NOT aligned with the car's parking spot. On the raslab map
    # (rtabmap_2d_final) the spot sits at roughly (+0.4, -0.55, -84.5 deg).
    #
    # The yaw was -1.3928 rad (-79.8 deg) until 2026-08-11, inherited from the
    # RTABMap ground-truth start pose of the 2026-08-05 bags. It was 4.7 deg off.
    # Replaced with a measurement that does not involve a localizer at all:
    # scripts/live_runs/heading_from_scan.py scores the raw LiDAR scan against
    # this occupancy grid over a yaw/xy grid search. Five samples, two cold
    # launches, one deliberate re-park:
    #   2026-08-10             -84.50 deg  (score 0.857)
    #   2026-08-11 run A       -85.00 deg  (0.916)
    #   2026-08-11 run B       -85.00 deg  (0.913, after roll-off/roll-on)
    #   2026-08-11 run C       -84.25 deg  (0.893, deliberately re-parked off-mark)
    #   2026-08-11 AMCL settle -83.97 deg  (independent algorithm, seeded at -79.8
    #                                       and pulled 4.2 deg toward the geometry)
    # Total spread 1.03 deg; the four scan fits span 0.75 deg and mean -84.69.
    # -84.50 is kept as the value rather than the mean: the yaw search step is
    # 0.25 deg and the difference is 0.19 deg, well inside the noise.
    #
    # The peak is single and unambiguous, which retires the old "a rectangular
    # lab is symmetric to a planar LiDAR" explanation for the recurring ~90 deg
    # confusion here. The old value scored 77-81 % of best and figure-8
    # waypoint 0 (-92.08 deg) scores 62-64 % — it does not fit the map, so
    # nothing should seed itself from it.
    #
    # NOT changed, deliberately: x/y. The same fits consistently prefer
    # y = -0.515 (identical in all four) and x = 0.385-0.415, i.e. ~6 cm off the
    # values below. Position sits in a much shallower basin than yaw at this
    # grid resolution, 6 cm is well inside AMCL's convergence, and the offline
    # replay seeds share these numbers. Measure it properly before moving it.
    #
    # A car parked at the origin that reports a large non-zero map pose is
    # therefore *correct* — it is not drift.
    #
    # This was (0,0,0,0), i.e. ~0.73 m and 80 deg from the truth, and AMCL cannot
    # walk that off while the car sits still: update_min_d/update_min_a below gate
    # the filter on MOTION, so parked it never runs a laser update and amcl_pose
    # never republishes. The symptom is a car that has never moved rendering
    # displaced and rotated in the map, with a filter that looks perfectly healthy
    # — and re-seeding it by hand via /initialpose appears to do nothing at all.
    initial_pose:
      x: 0.445
      y: -0.575
      z: 0.0
      yaw: -1.4748  # radians = -84.5 deg; measured 2026-08-11, was -1.3928 (-79.8)
    # Motion model. odom->base_link comes from the 30 Hz EKF fusing VESC + rf2o +
    # two IMUs, which is good dead reckoning between updates — keep the process
    # noise low and let the measurement do the correcting.
    alpha1: 0.05  # 0.3
    alpha2: 0.05  # 0.3
    alpha3: 0.05  # 0.3
    alpha4: 0.05  # 0.3
    alpha5: 0.05  # 0.3
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0  # was 4.0; beyond ~1 m nothing contributes at sigma_hit 0.15
    laser_max_range: -1.0 # -1.0, 12.0, 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field" # beam, likelihood_field, or likelihood_field_prob
    max_beams: 200  # was 90, of the X4's ~625
    max_particles: 4000  # was 500
    min_particles: 1000  # was 100
    odom_frame_id: "odom"
    pf_err: 0.02  # was 0.05
    pf_z: 0.99
    # No random-particle injection. Recovery from a kidnap is not currently wanted;
    # raise recovery_alpha_slow/fast (0.001 / 0.1) if that changes.
    recovery_alpha_fast: 0.0  # 0.0, 0.1
    recovery_alpha_slow: 0.0  # 0.0, 0.001
    resample_interval: 1  # 1, 3
    robot_model_type: "nav2_amcl::DifferentialMotionModel" # nav2_amcl::DifferentialMotionModel, nav2_amcl::OmniMotionModel
    save_pose_rate: 0.5  # 0.5, 0.1
    # 0.15 m is 3 map cells: wide enough for the grid's own +-25 mm quantisation and
    # the wall thickness, narrow enough that a 0.1 m pose error costs likelihood.
    sigma_hit: 0.15  # was 0.4
    # tf_broadcast is overridden by localization.launch.py: true only when map_tf_publisher:='amcl'.
    # The launch file, not this file, decides which node owns map->odom. Keep this false so the
    # YAML never implies AMCL is the map-frame broadcaster (matches localizer_pf.yaml).
    tf_broadcast: false
    transform_tolerance: 1.0 # 0.2
    update_min_a: 0.1  # was 0.5
    update_min_d: 0.05  # was 0.2; motion-triggered, but do not throw away the evidence
    z_hit: 0.80  # was 0.35
    z_max: 0.0  # unused by likelihood_field; zeroed so it cannot imply a beam model
    z_rand: 0.20  # was 0.5
    z_short: 0.0  # unused by likelihood_field
    scan_topic: lidar/scan_filtered # /lidar/scan_filtered
    map_topic: map
    first_map_only: false
